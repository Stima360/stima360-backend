<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <title>Prenota un appuntamento | STIMA360</title>
  <link rel="stylesheet" href="/prenota/assets/booking.css">
  <script type="module" src="/prenota/assets/booking-page.js"></script>
</head>
<body>
  <main class="booking-shell" aria-labelledby="booking-brand-title">
    <header class="brand-header">
      <div class="brand-mark" aria-hidden="true">S360</div>
      <div>
        <p class="eyebrow">STIMA360</p>
        <p id="booking-brand-title" class="brand-title">Prenotazione appuntamento</p>
      </div>
    </header>

    <div id="booking-app" class="booking-app" aria-live="polite">
      <section class="panel state-panel">
        <div class="spinner" aria-hidden="true"></div>
        <p>Caricamento…</p>
      </section>
    </div>

    <noscript>
      <section class="panel">
        <p>Per prenotare un appuntamento è necessario attivare JavaScript nel browser.</p>
      </section>
    </noscript>
  </main>
</body>
</html>
