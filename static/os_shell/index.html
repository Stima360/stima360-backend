<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>STIMA360 OS</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="stylesheet" href="/os/assets/app.css">
</head>
<body>
  <div id="login-view">
    <div class="login-box">
      <h1>STIMA360 OS</h1>
      <p>Accesso operatore</p>
      <form id="login-form">
        <label for="login-email">Email</label>
        <input id="login-email" name="email" type="email" autocomplete="username" required>
        <label for="login-password">Password</label>
        <input id="login-password" name="password" type="password" autocomplete="current-password" required>
        <div id="login-error" class="field-error" role="alert"></div>
        <button type="submit" class="btn primary">Accedi</button>
      </form>
    </div>
  </div>

  <!--
    P28 - la barra del Superadmin.

    Sta FUORI da #app-view e prima di esso, non dentro la topbar, per una
    ragione sola: deve occupare la larghezza intera e spostare in giu' tutto il
    resto. Un badge nell'angolo della topbar si smette di vedere dopo dieci
    minuti; una barra che sposta la pagina no.

    Nasce `hidden` e viene scoperta da `main.js` quando /me dichiara un
    contesto di acting. Non ha un pulsante di chiusura, e non e' una svista:
    l'unico modo di farla sparire e' uscire dall'agenzia.
  -->
  <div id="acting-bar" class="acting-bar" role="status" hidden>
    <span class="acting-label">SUPERADMIN</span>
    <span id="acting-text" class="acting-text"></span>
    <button id="acting-exit-btn" type="button" class="btn acting-exit">
      Torna alla Platform
    </button>
  </div>

  <div id="app-view" hidden>
    <aside class="sidebar">
      <div class="brand">STIMA360 OS</div>
      <nav id="nav"></nav>
      <div id="env-badge" class="env-badge"></div>
    </aside>
    <main class="main">
      <header class="topbar">
        <h1 id="page-title">Oggi</h1>
        <div class="top-actions">
          <button id="logout-btn" type="button" class="btn ghost">Logout</button>
        </div>
      </header>
      <section id="content" class="content"></section>
    </main>
  </div>

  <script type="module" src="/os/assets/main.js"></script>
</body>
</html>
