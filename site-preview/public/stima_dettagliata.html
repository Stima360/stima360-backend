<!DOCTYPE html>
<html lang="it">
<head>
  <meta name="referrer" content="no-referrer" />
  <script src="preview-config.js"></script>
  <script src="submission.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700&family=Montserrat:wght@400;600;800;900&display=swap" rel="stylesheet">
  <meta charset="UTF-8" />
  <title>Stima dettagliata – Stima360</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    @keyframes moveClouds { 0%{transform:translateX(0)} 50%{transform:translateX(-30%)} 100%{transform:translateX(0)} }
    @keyframes glowShift { 0%{transform:translateY(0) scale(1);opacity:.5} 100%{transform:translateY(-20px) scale(1.1);opacity:.7} }

    body{
      font-family:'Nunito',sans-serif; background:#fff; margin:0; color:#2a2a2a;
    }
    /* sfondo come index */
    body::before{
      content:""; position:fixed; top:-100px; left:0; width:5000px; height:300px;
      background:url("nuvole.png") repeat-x; background-size:contain; opacity:.4; z-index:0;
      animation:moveClouds 50s ease-in-out infinite;
    }
    body::after{
      content:""; position:fixed; top:0; left:0; width:100%; height:1000px;
      background:linear-gradient(to bottom, rgba(0,255,213,.2) 0%, rgba(66,133,255,.15) 40%, rgba(186,0,255,.12) 70%, rgba(255,255,255,0) 100%);
      z-index:-2; animation:glowShift 25s ease-in-out infinite alternate; pointer-events:none;
    }

    /* container come index (più largo) */
    .container{
      position:relative; max-width:850px; width:90%; margin:50px auto; background:#fff;
      border-radius:20px; box-shadow:0 8px 30px rgba(0,0,0,.06); padding:45px 25px; z-index:1; box-sizing:border-box;
    }

    /* logo grande come index */
    .logo{ display:block; margin:0 auto 0px; width:95%; max-width:720px; min-width:240px; height:auto; transition:width .25s ease-in-out;margin-bottom: 0; }

    /* titolo come index */
    h2{ text-align:center; color:#19546a; margin-bottom:24px; font-weight:800; }
    
    .titolo-underline{
      font-size:0;
      line-height:0;
      margin-top:-11px;
    }

    .immobile{
      background:#eef7fa; border-radius:12px; padding:14px; margin-bottom:22px; color:#174459; font-size:1.05rem; line-height:1.5;
    }

    form{ display:flex; flex-direction:column; gap:18px; }
    label{ font-family:'Montserrat',sans-serif; font-weight:600; color:#19546a; font-size:1.1rem; }

    input,select,textarea{
      font-family:'Montserrat',sans-serif; padding:16px; font-size:1.05rem; border-radius:14px;
      border:1.5px solid #dfe6eb; background:#fafafa; transition:all .25s ease-in-out;
    }
    input:focus,select:focus,textarea:focus{ border-color:#0044cc; background:#fff; box-shadow:0 0 8px rgba(0,68,204,.3); outline:none; }

    button{
      background:linear-gradient(135deg,#f843f5,#4ca4fc,#42dfd2,#51c57f,#bedf77,#eeb94f,#ed4402);
      color:#fff; font-weight:700; border:none; border-radius:14px; padding:18px; font-size:1.3rem; cursor:pointer;
      box-shadow:0 5px 20px rgba(0,0,0,.15); transition:all .25s ease;
    }
    button:hover{ box-shadow:0 5px 25px rgba(0,68,204,.4); }
    button:active{ transform:scale(.97); }

    .flexrow{ display:flex; gap:12px; }
    .flexrow>div{ flex:1; }
    @media (max-width:700px){ .container{ max-width:95vw; padding:20px } .flexrow{ flex-direction:column } }
    
    .titolo-underline {
      font: 800 2.3rem 'Montserrat', sans-serif;
      color: #19546a;
      text-align: center;
      margin-bottom: 28px;
      position: relative;
    }

    .titolo-underline::after {
      content: "";
      display: block;
      height: 4px;
      border-radius: 6px;
      margin: 10px auto 0;
      width: 80%;
      max-width: 600px;
      transform: translateX(4px);
      background: linear-gradient(
        90deg,
        #6a00ff,
        #0076ff,
        #18a558,
        #ffd400,
        #ff7a00,
        #ff2a00,
        #6a00ff
      );
      background-size: 300% 100%;
      animation: rainbowFlow 14s linear infinite, pulseGlow 3s ease-in-out infinite alternate;
      box-shadow: 0 0 12px rgba(255, 200, 0, 0.5),
                  0 0 20px rgba(255, 0, 200, 0.3);
    }

    @keyframes rainbowFlow {
      from { background-position: 0 0; }
      to   { background-position: 300% 0; }
    }

    @keyframes pulseGlow {
      from { opacity: 0.75; }
      to   { opacity: 1; }
    }

    @keyframes rainbowMove {
      0% { background-position: 0% 50%; }
      100% { background-position: 100% 50%; }
    }
    /* 🌈 PULSANTE STIMA360 – IDENTICO ALLA LANDING */
button[type="submit"], #dettaglioForm button[type="button"]{
  position: relative;
  overflow: hidden;
  z-index: 1;

  /* Gradient animato IDENTICO */
  background: linear-gradient(
    135deg,
    #0028a6,#2d1f8a,#2a0064,
    #009c78,#007f8f,#ffd500,
    #ff7a00,#ff0000,#1faa2c
  );
  background-size: 300% 300%;
  animation: rainbowShift 6s ease infinite;

  color: #fff;
  font-weight: 700;
  border: none;
  border-radius: 14px;
  padding: 20px;
  font-size: 1.35rem;
  cursor: pointer;

  /* Effetto vetro */
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);

  box-shadow:
    0 1px 1px rgba(255,255,255,0.65),
    0 6px 25px rgba(0,0,0,0.18);

  transition: transform .25s ease, box-shadow .25s ease;
}

/* Hover: SOLO più glow, niente cambio colore */
button[type="submit"]:hover, #dettaglioForm button[type="button"]:hover{
  transform: scale(1.03);
  box-shadow: 0 10px 32px rgba(0,0,0,0.28);
}

button[type="submit"]:active, #dettaglioForm button[type="button"]:active{
  transform: scale(0.96);
}

/* 💎 Riflesso specchio iOS */
button[type="submit"]::before, #dettaglioForm button[type="button"]::before{
  content:"";
  position:absolute;
  top:6px;
  left:10px;
  right:10px;
  height:45%;
  border-radius:10px;
  background: linear-gradient(
    to bottom,
    rgba(255,255,255,0.85),
    rgba(255,255,255,0.15),
    rgba(255,255,255,0)
  );
  opacity:.9;
  pointer-events:none;
  z-index:2;
}

/* ✨ Glow esterno */
button[type="submit"]::after, #dettaglioForm button[type="button"]::after{
  content:"";
  position:absolute;
  inset:-8px;
  border-radius:14px;
  background: radial-gradient(
    circle,
    rgba(255,255,255,0.55),
    rgba(255,255,255,0) 70%
  );
  filter: blur(8px);
  opacity:.75;
  pointer-events:none;
  z-index:-1;
}

/* Animazione gradient */
@keyframes rainbowShift{
  0%{background-position:0% 50%}
  50%{background-position:100% 50%}
  100%{background-position:0% 50%}
}

  </style>
</head>
<body>
  <div class="container">
    <img src="IMGVendere/Team.png" alt="Logo Stima360" class="logo">

    <div class="titolo-underline"></div>

    <!-- riepilogo immobile e utente (solo lettura) -->
    <div id="infoImmobile" class="immobile"></div>

    <form id="dettaglioForm">
      <!-- campi base nascosti (già raccolti) -->
      <input type="hidden" name="id">
      <input type="hidden" name="nome">
      <input type="hidden" name="cognome">
      <input type="hidden" name="email">
      <input type="hidden" name="telefono">
      <input type="hidden" name="comune">
      <input type="hidden" name="microzona">
      <input type="hidden" name="via">
      <input type="hidden" name="civico">
      <input type="hidden" name="tipologia">
      <input type="hidden" name="mq">
      <input type="hidden" name="piano">
      <input type="hidden" name="locali">
      <input type="hidden" name="bagni">
      <input type="hidden" name="ascensore">
      <input type="hidden" name="pertinenze">
      <input type="hidden" name="stato">
      <input type="hidden" name="anno">

      <!-- nuovi campi provenienti da dati_personali -->
      <input type="hidden" name="posizioneMare">
      <input type="hidden" name="distanzaMare">
      <input type="hidden" name="barrieraMare">

      <input type="hidden" name="mqGarage">

      <input type="hidden" name="altroDescrizione">
      <input type="hidden" name="mqCantina">
      <input type="hidden" name="mqPostoAuto">
      <input type="hidden" name="mqTaverna">
      <input type="hidden" name="mqSoffitta">
      <input type="hidden" name="mqTerrazzo">
      <input type="hidden" name="numBalconi">

      <!-- SOLO nuovi campi da chiedere ora -->
      <label for="classe">Classe energetica</label>
      <select id="classe" name="classe" required>
        <option value="">Scegli...</option>
        <option>A4</option><option>A3</option><option>A2</option><option>A1</option>
        <option>B</option><option>C</option><option>D</option>
        <option>E</option><option>F</option><option>G</option>
      </select>

      <label for="riscaldamento">Riscaldamento</label>
      <select id="riscaldamento" name="riscaldamento" required>

        <div>
          <label for="condizionatore">Condizionatore</label>

<script>
/* ===============================
   CARICAMENTO DATI AUTORIZZATI
================================ */
const params = new URLSearchParams(location.search);
const token = params.get("token");
let dati = {};
let prefillValido = false;
let serverStimaId = null;
let detailSubmissionState = 'initialising';
let detailSubmissionIntent = null;

function abilitaForm(enabled) {
  Array.from(document.getElementById("dettaglioForm").elements).forEach(el => {
    el.disabled = !enabled;
  });
}

function bloccaRichiesta() {
  prefillValido = false;
  serverStimaId = null;
  abilitaForm(false);
  const esito = document.getElementById("esito");
  esito.textContent = "Link non valido o scaduto";
  esito.style.display = "block";
}

abilitaForm(false);

async function caricaDati() {
  try {
    if (!token) throw new Error();
    const res = await fetch(Stima360Preview.apiUrl("/api/prefill?t=" + encodeURIComponent(token)));
    if (!res.ok) throw new Error();
    dati = await res.json();
    if (!dati || !Number.isSafeInteger(dati.id) || dati.id <= 0) throw new Error();

    serverStimaId = String(dati.id);
    inizializzaPagina();
    detailSubmissionIntent = await Stima360Submission.detailIntent(token);
    prefillValido = true;
    abilitaForm(true);
    const record = Stima360Submission.record(detailSubmissionIntent);
    if (record.payload) {
      for (const [name, value] of Object.entries(record.payload)) {
        const field = document.getElementById('dettaglioForm').elements.namedItem(name);
        if (field && field.type !== 'hidden') field.value = value;
      }
      abilitaForm(false);
      const body = await Stima360Submission.receipt(detailSubmissionIntent);
      if (body) handleDetailReceipt(body);
      else showDetailNotReceived();
    } else {
      detailSubmissionState = 'ready';
    }
  } catch (error) {
    if (error.status === 410) showDetailGone();
    else if (prefillValido && detailSubmissionIntent?.payload && ![401, 403].includes(error.status)) showDetailUncertain();
    else bloccaRichiesta();
  }
}

/* ===============================
   INIZIALIZZAZIONE PAGINA
================================ */
function inizializzaPagina() {

  // --- Vista mare label ---
  let vistaMareLabel = "-";
  const vistaYN   = (dati.vistaMareYN || "").toLowerCase();
  const vistaDett = dati.vistaMareDettaglio || "";

  if (vistaYN === "si" || vistaYN === "sì") {
    if (vistaDett === "panoramica") vistaMareLabel = "Vista mare panoramica";
    else if (vistaDett === "parziale") vistaMareLabel = "Vista mare parziale";
    else if (vistaDett === "scarsa") vistaMareLabel = "Vista mare limitata";
    else vistaMareLabel = "Vista mare";
  }
  if (vistaYN === "no") vistaMareLabel = "Nessuna vista mare";

  dati.vistaMare = vistaMareLabel;
    // --- PERTINENZE (AGGIUNTA) ---
  const pert = [];

  if (dati.mqGiardino)   pert.push(`🌱 Giardino: ${dati.mqGiardino} mq`);
  if (dati.mqGarage)    pert.push(`🚗 Garage: ${dati.mqGarage} mq`);
  if (dati.mqPostoAuto) pert.push(`🅿️ Posto auto: ${dati.mqPostoAuto} mq`);
  if (dati.mqCantina)   pert.push(`📦 Cantina: ${dati.mqCantina} mq`);
  if (dati.mqTaverna)   pert.push(`🍽️ Taverna: ${dati.mqTaverna} mq`);
  if (dati.mqSoffitta)  pert.push(`🧳 Soffitta: ${dati.mqSoffitta} mq`);
  if (dati.mqTerrazzo)  pert.push(`🌅 Terrazzo: ${dati.mqTerrazzo} mq`);
  if (dati.numBalconi)  pert.push(`🚪 Balconi: ${dati.numBalconi}`);

  const pertRighe = pert.length ? pert : dati.pertinenze
    ? dati.pertinenze.split(',').map(p => '• ' + p.trim()) : ['Nessuna'];

  // Static markup keeps the existing labels and styling; values are text nodes.
  const info = document.getElementById("infoImmobile");
  info.innerHTML = `
    <b data-value="immobile"></b><br>
    📍 <b>Indirizzo:</b> <span data-value="indirizzo"></span><br>
    🧱 <b>Piano:</b> <span data-value="piano"></span> |
    <b>Locali:</b> <span data-value="locali"></span> |
    <b>Bagni:</b> <span data-value="bagni"></span><br>
    🛗 <b>Ascensore:</b> <span data-value="ascensore"></span><br>
    🏗️ <b>Stato:</b> <span data-value="stato"></span> |
    <b>Anno:</b> <span data-value="anno"></span><br>
    🌊 <b>Posizione mare:</b> <span data-value="posizioneMare"></span> |
    <b>Distanza:</b> <span data-value="distanzaMare"></span><br>
    👁️ <b>Vista mare:</b> <span data-value="vistaMare"></span> |
    🚧 <b>Barriera:</b> <span data-value="barrieraMare"></span><br>
    
    📁 <b>Pertinenze:</b><br>
    <span data-value="pertinenze"></span><br>
    
    👤 <b>Contatto:</b> <span data-value="contatto"></span><br>

    ✉️ <b>Email:</b> <span data-value="email"></span>
  `;
  const values = {
    immobile: `🏠 ${dati.tipologia || '-'} ${dati.mq || ''} mq`,
    indirizzo: `${dati.via || ''} ${dati.civico || ''}, ${dati.comune || ''} ${dati.microzona ? '('+dati.microzona+')' : ''}`,
    piano: dati.piano || '-', locali: dati.locali || '-', bagni: dati.bagni || '-',
    ascensore: dati.ascensore || '-', stato: dati.stato || '-', anno: dati.anno || '-',
    posizioneMare: dati.posizioneMare || '-', distanzaMare: dati.distanzaMare || '-',
    vistaMare: vistaMareLabel, barrieraMare: dati.barrieraMare || '-',
    contatto: `${dati.nome || ''} ${dati.cognome || ''} – ${dati.telefono || ''}`,
    email: dati.email || ''
  };
  Object.entries(values).forEach(([key, value]) => {
    info.querySelector(`[data-value="${key}"]`).textContent = value;
  });
  const pertBox = info.querySelector('[data-value="pertinenze"]');
  pertRighe.forEach((line, index) => {
    if (index) pertBox.appendChild(document.createElement('br'));
    pertBox.appendChild(document.createTextNode(line));
  });

  // --- RIEMPI HIDDEN ---
  const f = document.getElementById("dettaglioForm");
  Object.keys(f.elements).forEach(k => {
    if (f.elements[k] && dati[k] !== undefined) {
      f.elements[k].value = dati[k] ?? "";
    }
  });

  // --- TOGGLE CONDIZIONATORE ---
  const selCond = document.getElementById('condizionatore');
  const boxTipo = document.getElementById('wrap_condiz_tipo');
  const selTipo = document.getElementById('condiz_tipo');

  selCond.addEventListener('change', () => {
    boxTipo.style.display = selCond.value === 'Sì' ? 'block' : 'none';
    selCond.value === 'Sì'
      ? selTipo.setAttribute('required','required')
      : selTipo.removeAttribute('required');
  });

  // --- TOGGLE SPESE ---
  const selSpese = document.getElementById('spese_cond_flag');
  const boxSpese = document.getElementById('wrap_spese_mensili');
  const inpSpese = document.getElementById('spese_cond_mensili');

  selSpese.addEventListener('change', () => {
    boxSpese.style.display = selSpese.value === 'Sì' ? 'block' : 'none';
    selSpese.value === 'Sì'
      ? inpSpese.setAttribute('required','required')
      : inpSpese.removeAttribute('required');
  });

  selCond.dispatchEvent(new Event('change'));
  selSpese.dispatchEvent(new Event('change'));
}

/* ===============================
   AVVIO
================================ */
caricaDati();
</script>

<script>
document.getElementById("dettaglioForm").addEventListener("submit", async function(e){
  e.preventDefault();

  if (!prefillValido || !token || !serverStimaId || detailSubmissionState !== 'ready') return;

  const form = e.target;
  const fd = new FormData(form);

  // normalizza spese condominiali
  if (fd.get("spese_cond_flag") === "No") {
    fd.set("spese_cond", null);
  } else {
    fd.set("spese_cond", fd.get("spese_cond_mensili") || null);
  }

  // Authorisation and relational id come from the validated token/prefill.
  fd.set("token", token);
  fd.set("stima_id", serverStimaId);
  fd.set("id", serverStimaId);

  const payload = Object.fromEntries(fd.entries());
  try {
    Stima360Submission.freeze(detailSubmissionIntent, payload);
  } catch {
    detailSubmissionState = 'unavailable';
    abilitaForm(false);
    const esito = document.getElementById('esito');
    esito.textContent = 'Impossibile conservare i dati originali della richiesta. Nessun nuovo invio è stato effettuato.';
    esito.style.display = 'block';
    return;
  }
  detailSubmissionState = 'pending';
  abilitaForm(false);

  try {
    handleDetailReceipt(await Stima360Submission.submit(detailSubmissionIntent, payload));

  } catch (error) {
    if (error.status === 410) showDetailGone();
    else if (error.status === 401 || error.status === 403 || error.status === 404) bloccaRichiesta();
    else showDetailUncertain();
    alert("Errore invio dati. Riprova.");
  }
});

function detailRecoveryButton(label, action) {
  const button = document.querySelector('#dettaglioForm button');
  button.type = 'button';
  button.textContent = label;
  button.disabled = false;
  button.onclick = () => {
    if (detailSubmissionState !== 'recoverable' && detailSubmissionState !== 'uncertain') return;
    action();
  };
}

function showDetailUncertain() {
  detailSubmissionState = 'uncertain';
  const esito = document.getElementById('esito');
  esito.style.display = 'block';
  esito.textContent = 'Esito NON CONFERMATO: la richiesta potrebbe essere già stata salvata. Ricarica la pagina per verificarne la ricevuta.';
  detailRecoveryButton('Ricarica la pagina', () => location.reload());
}

function showDetailGone() {
  detailSubmissionState = 'unavailable';
  abilitaForm(false);
  document.getElementById('detailReceipt').hidden = true;
  document.getElementById('detailNewIntent').hidden = true;
  const esito = document.getElementById('esito');
  esito.style.display = 'block';
  esito.textContent = 'Questa richiesta è stata rimossa e non può essere reinviata. ';
  const start = document.createElement('a');
  start.href = 'index.html';
  start.textContent = 'Avvia una nuova valutazione dalla pagina iniziale.';
  esito.appendChild(start);
}

function showDetailNotReceived() {
  detailSubmissionState = 'recoverable';
  const esito = document.getElementById('esito');
  esito.style.display = 'block';
  esito.textContent = 'La ricevuta non è ancora disponibile. Puoi riprovare la stessa richiesta conservando i dati originali.';
  detailRecoveryButton('Riprova la stessa richiesta', () => recoverDetails(false, true));
}

function handleDetailReceipt(body) {
  if (body.receipt.stima_id !== null && body.receipt.stima_id !== undefined
      && body.receipt.stima_id !== Number(serverStimaId)) throw new Error('Ricevuta collegata a un’altra stima');
  const esito = document.getElementById('esito');
  esito.style.display = 'block';
  const receiptBox = document.getElementById('detailReceipt');
  receiptBox.hidden = false;
  receiptBox.textContent = 'Ricevuta verificata: ' + body.receipt.request_id + '. Stima n. ' + serverStimaId + '.';
  if (body.receipt.status === 'completed') {
    if (body.ok !== true || body.receipt.stima_id !== Number(serverStimaId)
        || !Number.isSafeInteger(body.receipt.detail_id) || body.receipt.detail_id <= 0) {
      throw new Error('Ricevuta senza collegamento valido al dettaglio');
    }
    Stima360Submission.complete(detailSubmissionIntent);
    detailSubmissionState = 'success';
    esito.textContent = '✅ Richiesta inviata correttamente. Ti contatteremo a breve.';
    document.getElementById('dettaglioForm').style.display = 'none';
    document.getElementById('detailNewIntent').hidden = false;
  } else {
    detailSubmissionState = 'recoverable';
    esito.textContent = body.receipt.resumable
      ? 'Richiesta ricevuta: alcune operazioni devono ancora essere completate. Recupera la stessa richiesta senza inviarne una nuova.'
      : 'Richiesta ricevuta: è necessaria una verifica del servizio. Puoi verificare nuovamente la ricevuta.';
    detailRecoveryButton(body.receipt.resumable ? 'Recupera la richiesta' : 'Verifica ricevuta',
      () => recoverDetails(body.receipt.resumable));
  }
}

async function recoverDetails(resume = false, resend = false) {
  if (!prefillValido || detailSubmissionState !== 'recoverable') return;
  detailSubmissionState = 'pending';
  abilitaForm(false);
  try {
    const body = resend
      ? await Stima360Submission.submit(detailSubmissionIntent, Stima360Submission.record(detailSubmissionIntent).payload)
      : resume ? await Stima360Submission.resume(detailSubmissionIntent) : await Stima360Submission.receipt(detailSubmissionIntent);
    if (body) handleDetailReceipt(body);
    else showDetailNotReceived();
  } catch (error) {
    if (error.status === 410) showDetailGone();
    else if ([401, 403].includes(error.status)) bloccaRichiesta();
    else showDetailUncertain();
  }
}

document.getElementById('detailEdit').addEventListener('click', async (event) => {
  event.preventDefault();
  if (!prefillValido || detailSubmissionState !== 'success') return;
  detailSubmissionState = 'initialising';
  try {
    detailSubmissionIntent = await Stima360Submission.detailIntent(token, true);
    const button = document.querySelector('#dettaglioForm button');
    button.type = 'submit';
    button.textContent = 'Invia richiesta dettagliata';
    button.onclick = null;
    document.getElementById('dettaglioForm').style.display = '';
    document.getElementById('detailNewIntent').hidden = true;
    document.getElementById('detailReceipt').hidden = true;
    document.getElementById('esito').style.display = 'none';
    abilitaForm(true);
    detailSubmissionState = 'ready';
  } catch {
    bloccaRichiesta();
  }
});
</script>

</body>
